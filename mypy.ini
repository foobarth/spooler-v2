[mypy]
python_version = 3.12
ignore_missing_imports = True
# Scoped strictness: the machinery modules are enforced; the rest of the
# codebase joins as it gets typed (see the typing PR's notes in AGENTS.md).
files = state.py,channels.py,printers,notify.py,notifiers.py,job_queue.py,mqtt_bridge.py,config.py,features.py,dataset.py,push.py
# Imported project modules are analyzed for their types but their own errors
# are suppressed until they join the enforced set.
follow_imports = silent
